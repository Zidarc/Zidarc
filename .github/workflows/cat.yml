# Feed-the-cat game: buttons in the README open "cat|feed" / "cat|play" / "cat|pet" issues (bare "feed" etc. work too).
# No concurrency group on purpose: GitHub keeps only one pending run per group and cancels the rest, which dropped
# visits when people clicked several times. Runs go in parallel instead; one that loses the push race throws its
# work away, starts again from the latest state and retries.
name: billo the cat
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  react:
    if: startsWith(github.event.issue.title, 'cat|') || contains(fromJSON('["feed","play","pet"]'), github.event.issue.title)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: react and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 10); do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/cat.js
            git add -A
            git commit -q -m "🐈‍⬛ billo: ${ISSUE_USER} visited" || exit 0
            git push -q origin HEAD:main && exit 0
            echo "push lost a race (attempt $i), retrying from the latest state"
            sleep $((RANDOM % 6 + 2))
          done
          exit 1
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
      - name: reply and close
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
