# Feed-the-cat game: buttons in the README open "cat|feed" / "cat|play" / "cat|pet" issues.
name: huna the cat
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  react:
    if: startsWith(github.event.issue.title, 'cat|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cat.js
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🐈‍⬛ huna: ${ISSUE_USER} visited" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
      - name: reply and close
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
