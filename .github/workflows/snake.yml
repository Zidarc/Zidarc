# Contribution snake in crimson, wrapped in the terminal window and published to the "output" branch.
name: snake
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/snake.yml', 'scripts/snake.js']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-raw.svg?palette=github-dark&color_snake=#ff2266&color_dots=#24060f,#4d0f24,#880022,#c4143f,#ff2266
      # snk runs in Docker as root, so dist/ isn't writable here: write the framed snake to its own folder.
      - run: mkdir -p site && node scripts/snake.js dist/snake-raw.svg site/snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
