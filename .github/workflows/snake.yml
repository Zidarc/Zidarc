# Contribution snake in crimson, published to the "output" branch.
name: snake
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2266&color_dots=#1a0b11,#4d0f24,#880022,#c4143f,#ff2266
            dist/snake-light.svg?color_snake=#ff2266&color_dots=#f3e8eb,#ffc2d1,#ff8fab,#ff4d7d,#ff2266
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
