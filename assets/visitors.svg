<svg xmlns="http://www.w3.org/2000/svg" width="900" height="234" viewBox="0 0 900 234" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="15">
<title>visitors.log — byte</title>
<style>
.show{opacity:0;animation:show .01s linear forwards}
