<g class="slide" style="animation-delay:1.50s"><text x="30" y="282" font-weight="700"><tspan fill="#7a3a4c">drwxr-xr-x </tspan><tspan fill="#ff2266">ishara/</tspan></text><text x="48" y="308" fill="#ffe0e8">AI campus accessibility app for visually</text><text x="48" y="328" fill="#ffe0e8">and hearing-impaired students: real-time</text><text x="48" y="348" fill="#ffe0e8">AR wayfinding and adaptive safety alerts</text><text x="48" y="368" fill="#ffe0e8">where static, single-sense infrastructure</text><text x="48" y="388" fill="#ffe0e8">fails.</text><rect x="48" y="401" width="57.2" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="55" y="415" font-size="12" fill="#ff6f91" textLength="43.2" lengthAdjust="spacing">Python</text><rect x="113.2" y="401" width="28.4" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="120.2" y="415" font-size="12" fill="#ff6f91" textLength="14.4" lengthAdjust="spacing">AI</text><rect x="149.6" y="401" width="28.4" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="156.6" y="415" font-size="12" fill="#ff6f91" textLength="14.4" lengthAdjust="spacing">C#</text><rect x="186" y="401" width="28.4" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="193" y="415" font-size="12" fill="#ff6f91" textLength="14.4" lengthAdjust="spacing">AR</text></g>
<g class="slide" style="animation-delay:1.75s"><text x="465" y="282" font-weight="700"><tspan fill="#7a3a4c">drwxr-xr-x </tspan><tspan fill="#ff2266">zidarc/</tspan></text><text x="483" y="308" fill="#ffe0e8">This profile. Pixel-art cards rebuilt by</text><text x="483" y="328" fill="#ffe0e8">GitHub Actions every 3 hours, and Billo, a</text><text x="483" y="348" fill="#ffe0e8">cat you can feed by opening an issue. No</text><text x="483" y="368" fill="#ffe0e8">server: the repo is her database.</text><rect x="483" y="381" width="64.4" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="490" y="395" font-size="12" fill="#ff6f91" textLength="50.4" lengthAdjust="spacing">Node.js</text><rect x="555.4" y="381" width="35.6" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="562.4" y="395" font-size="12" fill="#ff6f91" textLength="21.6" lengthAdjust="spacing">SVG</text><rect x="599" y="381" width="114.8" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="606" y="395" font-size="12" fill="#ff6f91" textLength="100.8" lengthAdjust="spacing">GitHub Actions</text></g>

