<svg xmlns="http://www.w3.org/2000/svg" width="900" height="472" viewBox="0 0 900 472" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="15">
<title>~/projects — ali@zidarc</title>
<style>
.show{opacity:0;animation:show .01s linear forwards}
.fi{animation:fadein .2s ease-out both}
.slide{animation:slide .35s ease-out both}
.cur{animation:blink 1s step-end infinite}
.ember{animation:rise linear infinite}
@keyframes show{to{opacity:1}}
@keyframes hide{to{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.6}100%{opacity:0;transform:translate(18px,-432px)}}@keyframes ty1{to{transform:translateX(144px)}}</style>
<defs>
  <clipPath id="win"><rect x="10" y="10" width="880" height="452" rx="12"/></clipPath>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
  <radialGradient id="vign" cx="20%" cy="45%" r="70%"><stop offset="0" stop-color="#ff2266" stop-opacity=".09"/><stop offset="1" stop-color="#ff2266" stop-opacity="0"/></radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".025"/></pattern>
</defs>
<rect x="10" y="10" width="880" height="452" rx="12" fill="none" stroke="#ff2266" stroke-width="3" opacity=".45" filter="url(#glow)"/>
<g clip-path="url(#win)">
  <rect x="10" y="10" width="880" height="452" fill="#0d0008"/>
  <rect class="ember" x="384" y="452" width="2" height="2" fill="#ff6f91" style="animation-duration:7.5s;animation-delay:-3.9s"/>
<rect class="ember" x="59" y="452" width="3" height="3" fill="#ff6f91" style="animation-duration:10.2s;animation-delay:-10.0s"/>
<rect class="ember" x="674" y="452" width="3" height="3" fill="#ff6f91" style="animation-duration:7.7s;animation-delay:-5.1s"/>
<rect class="ember" x="225" y="452" width="2" height="2" fill="#ff2266" style="animation-duration:12.6s;animation-delay:-0.9s"/>
<rect class="ember" x="242" y="452" width="3" height="3" fill="#ff2266" style="animation-duration:9.0s;animation-delay:-2.1s"/>
<rect class="ember" x="253" y="452" width="2" height="2" fill="#ff2266" style="animation-duration:13.0s;animation-delay:-9.5s"/>
<rect class="ember" x="137" y="452" width="2" height="2" fill="#ff6f91" style="animation-duration:11.4s;animation-delay:-9.3s"/>
<rect class="ember" x="406" y="452" width="2" height="2" fill="#ff2266" style="animation-duration:11.3s;animation-delay:-3.7s"/>
  <rect x="10" y="10" width="880" height="34" fill="#16050d"/>
