<g class="slide" style="animation-delay:1.00s"><text x="30" y="112" font-weight="700"><tspan fill="#7a3a4c">drwxr-xr-x </tspan><tspan fill="#ff2266">cyber-loop/</tspan></text><text x="48" y="138" fill="#ffe0e8">Real-time team puzzle game made for</text><text x="48" y="158" fill="#ffe0e8">DevDay'26. Teams race through graph-based</text><text x="48" y="178" fill="#ffe0e8">puzzles on a live Supabase Realtime</text><text x="48" y="198" fill="#ffe0e8">leaderboard, with ember particles and a</text><text x="48" y="218" fill="#ffe0e8">glassmorphism UI.</text><rect x="48" y="231" width="50" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="55" y="245" font-size="12" fill="#ff6f91" textLength="36" lengthAdjust="spacing">React</text><rect x="106" y="231" width="42.8" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="113" y="245" font-size="12" fill="#ff6f91" textLength="28.8" lengthAdjust="spacing">Vite</text><rect x="156.8" y="231" width="86" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="163.8" y="245" font-size="12" fill="#ff6f91" textLength="72" lengthAdjust="spacing">TypeScript</text><rect x="250.8" y="231" width="64.4" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="257.8" y="245" font-size="12" fill="#ff6f91" textLength="50.4" lengthAdjust="spacing">Express</text><rect x="323.20000000000005" y="231" width="71.6" height="19" rx="3" fill="#24060f" stroke="#ff2266" stroke-opacity=".6"/><text x="330.20000000000005" y="245" font-size="12" fill="#ff6f91" textLength="57.6" lengthAdjust="spacing">Supabase</text></g>
